
{% block content %}
<style>.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.error{
        color:#e2203a;

}
.login-card{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.login-card h2{
    text-align:center;
    color:#44506e;
    margin-bottom:25px;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#44506e;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#1d4ed8;
}.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

.form-group input:focus{
    outline:none;
    border-color:#44506e;
    box-shadow:0 0 6px rgba(37,99,235,.3);
}
</style>
<div class="login-container">

    <div class="login-card">

        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div><br><br>
        {%if error %}    <div class="error">{{ error }}</div>   {% endif %}
          <br>  <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
