<!DOCTYPE html>
<html>
<head>
    <title>Security</title>

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial;
        }

        .box{
            width:420px;
            margin:60px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            background:#273c8f;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:6px;
        }

    </style>

</head>

<body>

<div class="box">

<h2>Change Password</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Change Password
    </button>

</form>

</div>

</body>
</html>
